{% extends "base.html" %}
{% block title %}비밀번호 찾기 - {% endblock %}
{% block content %}
<section class="box auth-box">
  <h1 class="auth-title">비밀번호 찾기</h1>
  {% if step == 'email' %}
  <p class="muted small">가입한 이메일로 인증번호를 보내드려요.</p>
  <form method="post" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="action" value="send">
    <label>이메일
      <input type="email" name="email" value="{{ email }}" required autofocus autocomplete="email">
    </label>
    <button class="btn btn-block">인증번호 받기</button>
  </form>
  {% else %}
  <div class="verify-email">
    <span><strong>{{ email }}</strong> 으로 받은 인증번호와 새 비밀번호를 입력해주세요.</span>
    <form method="post" class="inline">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="action" value="restart">
      <button class="link-btn">이메일 변경</button>
    </form>
  </div>
  <form method="post" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="action" value="reset">
    <label>인증번호
      <input name="code" inputmode="numeric" pattern="\d{6}" maxlength="6" required autofocus autocomplete="one-time-code">
    </label>
    <label>새 비밀번호
      <input type="password" name="password" required minlength="8" maxlength="64" autocomplete="new-password">
      <small>8자 이상, 영문과 숫자 포함</small>
    </label>
    <label>새 비밀번호 확인
      <input type="password" name="password2" required minlength="8" maxlength="64" autocomplete="new-password">
    </label>
    <button class="btn btn-block">비밀번호 변경</button>
  </form>
  {% endif %}
  <div class="auth-links"><a href="{{ url_for('auth.login') }}">로그인으로 돌아가기</a></div>
</section>
{% endblock %}
