{% extends "base.html" %}
{% block title %}비밀번호 찾기 - {% endblock %}
{% block content %}
<section class="box auth-box">
  <h1 class="auth-title">비밀번호 찾기</h1>
  <p class="muted small">가입할 때 받은 <strong>복구 코드</strong>로 새 비밀번호를 정할 수 있어요.</p>
  <form method="post" class="form" autocomplete="off">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>식별 코드
      <input name="username" value="{{ username }}" required autofocus autocomplete="username" spellcheck="false">
    </label>
    <label>복구 코드
      <input name="recovery" required maxlength="24" placeholder="XXXX-XXXX-XXXX-XXXX" spellcheck="false" autocapitalize="characters">
    </label>
    <label>새 비밀번호
      <input type="password" name="password" required minlength="8" maxlength="64" autocomplete="new-password">
      <small>8자 이상, 영문과 숫자 포함</small>
    </label>
    <label>새 비밀번호 확인
      <input type="password" name="password2" required minlength="8" maxlength="64" autocomplete="new-password">
    </label>
    {% include "_captcha.html" %}
    <button class="btn btn-block">비밀번호 변경</button>
  </form>
  <p class="muted small center-text">복구 코드도 잃어버렸다면 운영자에게 문의해주세요.</p>
  <div class="auth-links"><a href="{{ url_for('auth.login') }}">로그인으로 돌아가기</a></div>
</section>
{% endblock %}
