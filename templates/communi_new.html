{% extends "base.html" %}
{% block title %}커뮤니 만들기 - {% endblock %}
{% block content %}
<section class="card narrow">
  <h1 class="card-title">커뮤니 만들기</h1>
  <form method="post" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>커뮤니 이름
      <input name="name" value="{{ form.name }}" maxlength="20" required placeholder="예: 고양이">
    </label>
    <label>주소
      <div class="input-prefix"><span>/c/</span><input name="slug" value="{{ form.slug }}" maxlength="20" required pattern="[a-z0-9_]{2,20}" placeholder="cat"></div>
      <small>영문 소문자, 숫자, _ (2~20자)</small>
    </label>
    <label>소개
      <textarea name="description" maxlength="200" rows="3" placeholder="어떤 이야기를 나누는 곳인가요?">{{ form.description }}</textarea>
    </label>
    <button class="btn">만들기</button>
  </form>
</section>
{% endblock %}
