{% extends "base.html" %}
{% block title %}회원가입 - {% endblock %}
{% block content %}
<section class="box auth-box">
  <h1 class="auth-title">회원가입</h1>
  <form method="post" class="form" autocomplete="off">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>식별 코드
      <input name="username" value="{{ form.username }}" required autofocus minlength="4" maxlength="20"
             pattern="[a-zA-Z][a-zA-Z0-9_]{3,19}" autocomplete="username" spellcheck="false" placeholder="로그인할 때 쓰는 아이디">
      <small>영문 소문자로 시작, 4~20자 (영문 소문자 · 숫자 · _). 다른 사람에게는 보이지 않아요.</small>
    </label>
    <label>비밀번호
      <input type="password" name="password" required minlength="8" maxlength="64" autocomplete="new-password">
      <small>8자 이상, 영문과 숫자 포함</small>
    </label>
    <label>비밀번호 확인
      <input type="password" name="password2" required minlength="8" maxlength="64" autocomplete="new-password">
    </label>
    <label>닉네임
      <input name="nickname" value="{{ form.nickname }}" required maxlength="12" autocomplete="nickname">
      <small>2~12자 한글, 영문, 숫자, _ · 글과 댓글에 보이는 이름이에요.</small>
    </label>
    {% include "_captcha.html" %}
    <label class="check">
      <input type="checkbox" name="agree" value="1" required>
      <span><a href="{{ url_for('main.terms') }}" target="_blank" class="u">이용약관</a> 및
        <a href="{{ url_for('main.privacy') }}" target="_blank" class="u">개인정보처리방침</a>에 동의합니다.</span>
    </label>
    <button class="btn btn-block">가입하기</button>
  </form>
  <div class="auth-links">
    이미 회원이신가요? <a href="{{ url_for('auth.login') }}"><strong>로그인</strong></a>
  </div>
</section>
{% endblock %}
