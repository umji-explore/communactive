{% extends "base.html" %}
{% block title %}회원가입 - {% endblock %}
{% block content %}
<section class="box auth-box">
  <h1 class="auth-title">회원가입</h1>
  <ol class="steps">
    <li class="{{ 'on' if step == 'email' }}">1. 이메일 인증</li>
    <li class="{{ 'on' if step == 'verify' }}">2. 정보 입력</li>
  </ol>

  {% if step == 'email' %}
  <p class="muted small">gmail.com 또는 naver.com 이메일로 가입할 수 있어요.</p>
  <form method="post" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="action" value="send">
    <label>이메일
      <input type="email" name="email" value="{{ email }}" required autofocus autocomplete="email"
             placeholder="example@gmail.com" pattern=".+@(gmail\.com|naver\.com)" title="gmail.com 또는 naver.com 이메일">
    </label>
    <button class="btn btn-block">인증번호 받기</button>
  </form>

  {% else %}
  <div class="verify-email">
    <span><strong>{{ email }}</strong> 으로 보낸 6자리 인증번호를 입력해주세요.</span>
    <form method="post" class="inline">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="action" value="restart">
      <button class="link-btn">이메일 변경</button>
    </form>
  </div>
  <form method="post" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="action" value="create">
    <label>인증번호
      <input name="code" inputmode="numeric" pattern="\d{6}" maxlength="6" required autofocus autocomplete="one-time-code" placeholder="000000">
    </label>
    <label>닉네임
      <input name="nickname" value="{{ form.nickname }}" required maxlength="12" autocomplete="nickname">
      <small>2~12자 한글, 영문, 숫자, _</small>
    </label>
    <label>비밀번호
      <input type="password" name="password" required minlength="8" maxlength="64" autocomplete="new-password">
      <small>8자 이상, 영문과 숫자 포함</small>
    </label>
    <label>비밀번호 확인
      <input type="password" name="password2" required minlength="8" maxlength="64" autocomplete="new-password">
    </label>
    <label class="check">
      <input type="checkbox" name="agree" value="1" required>
      <span><a href="{{ url_for('main.terms') }}" target="_blank" class="u">이용약관</a> 및
        <a href="{{ url_for('main.privacy') }}" target="_blank" class="u">개인정보처리방침</a>에 동의합니다.</span>
    </label>
    <button class="btn btn-block">가입하기</button>
  </form>
  <form method="post" class="resend">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="action" value="send">
    <input type="hidden" name="email" value="{{ email }}">
    <span class="muted small">메일이 안 왔나요?</span> <button class="link-btn">인증번호 다시 받기</button>
  </form>
  {% endif %}

  <div class="auth-links">
    이미 회원이신가요? <a href="{{ url_for('auth.login') }}"><strong>로그인</strong></a>
  </div>
</section>
{% endblock %}
