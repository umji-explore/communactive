{% extends "base.html" %}
{% block title %}로그인 - {% endblock %}
{% block content %}
<section class="box auth-box">
  <h1 class="auth-title">로그인</h1>
  <form method="post" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label>식별 코드
      <input name="username" value="{{ username }}" required autofocus autocomplete="username" spellcheck="false">
    </label>
    <label>비밀번호
      <input type="password" name="password" required autocomplete="current-password">
    </label>
    <button class="btn btn-block">로그인</button>
  </form>
  <div class="auth-links">
    <a href="{{ url_for('auth.forgot') }}">비밀번호 찾기</a>
    <span class="dot"></span>
    <a href="{{ url_for('auth.signup') }}"><strong>회원가입</strong></a>
  </div>
</section>
{% endblock %}
